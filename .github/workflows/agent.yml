# Starts an unattended Claude session (agent/action.yml) when the check
# workflow fails on main, or when I label an issue "agent". The weekly check
# run is the schedule here: when a plugin breaks upstream, the failure starts
# the fix.

name: agent

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  issues:
    types: [labeled]

# One agent at a time, so two never race to land.
concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  agent:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event != 'pull_request') ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config core.hooksPath .githooks
      - uses: ./agent
        with:
          mode: ${{ github.event_name == 'issues' && 'issue' || 'ci-fix' }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          check: sh scripts/check.sh && sh scripts/test-install.sh
          ci-workflows: check.yml
