# Checks the manifest and installs every plugin from it with ssh turned off.
# It also runs weekly, since the plugins live in other repos and the Claude
# Code installer can change under us.

name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: sh scripts/check.sh
      - run: sh scripts/test-install.sh
